version: '3.9'

services:
  signstream_ci:
    image: node:18
    container_name: signstream_ci_app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "6000:6000"
    env_file:
      - .env
    depends_on:
      - mongo_ci
    command: sh -c "npm install && npm start"
    restart: always

  mongo_ci:
    image: mongo:latest
    container_name: signstream_ci_mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-ci-data:/data/db
    restart: always

volumes:
  mongo-ci-data:
